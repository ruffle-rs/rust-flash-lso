[package]
name = "web"
version = "0.1.0"
authors = ["CUB3D <callumthom11@gmail.com>"]
edition = "2024"
repository = "https://github.com/ruffle-rs/rust-flash-lso"
license = "MIT"
description = "Browser based viewer and editor for Flash Player save data"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "=0.23.0", features = ["csr"] }
wasm-bindgen = "=0.2.127"
web-sys = "0.3.103" # Version of this comes from pin in wasm-bindgen
js-sys = "0.3.103"# Version of this comes from pin in wasm-bindgen
log = "=0.4.34"
wasm-logger = "=0.2.0"
flash-lso = { path = "../flash-lso", features = ["serde", "flex"] }
gloo-file = "=0.4.0"
